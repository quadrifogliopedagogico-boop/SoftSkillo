<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softskillo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f0f0;--bg2:#fff;--bg3:#e5e5e5;
  --green:#58cc02;--green-d:#46a302;--green-l:#d7ffb8;
  --blue:#1cb0f6;--blue-d:#1899d6;--blue-l:#ddf4ff;
  --purple:#ce82ff;--purple-d:#a855f7;--purple-l:#f3e8ff;
  --orange:#ff9600;--orange-d:#e08600;--orange-l:#fff4e0;
  --red:#ff4b4b;--red-d:#ea2b2b;--red-l:#ffe0e0;
  --amber:#fbbf24;--amber-d:#d9a01f;--amber-l:#fef9c3;
  --teal:#2dd4bf;--teal-d:#14b8a6;--teal-l:#ccfbf1;
  --text:#3c3c3c;--text2:#777;--text3:#aaa;
  --shadow:0 4px 0;
  --a1:#1cb0f6;--a1d:#1899d6;--a1l:#ddf4ff;
  --a2:#ce82ff;--a2d:#a855f7;--a2l:#f3e8ff;
  --a3:#ff9600;--a3d:#e08600;--a3l:#fff4e0;
  --a4:#2dd4bf;--a4d:#14b8a6;--a4l:#ccfbf1;
  --r:16px;--rs:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:2px solid var(--bg3);padding:8px 16px;display:flex;align-items:center;gap:12px}
.topbar .tb-b{background:none;border:2px solid var(--bg3);border-radius:var(--rs);padding:4px 10px;cursor:pointer;font-family:'Nunito';font-size:.85em;font-weight:700;color:var(--text2)}
.topbar .tb-t{flex:1;font-family:'Fredoka';font-weight:600;font-size:1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-x{font-weight:800;font-size:.85em;color:var(--amber-d)}
.topbar .tb-h{font-size:1.1em}
.pb{width:100%;height:16px;background:var(--bg3);border-radius:8px;overflow:hidden;position:relative}
.pb-f{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.3,1.2);background:linear-gradient(90deg,var(--green),#78e008)}
.pb-f::after{content:'';position:absolute;top:2px;left:4px;right:4px;height:5px;background:rgba(255,255,255,.3);border-radius:3px}
.c{max-width:600px;margin:0 auto;padding:16px;padding-bottom:100px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border:none;border-radius:var(--r);font-family:'Nunito';font-weight:800;font-size:1em;cursor:pointer;transition:all .1s;user-select:none;text-transform:uppercase;letter-spacing:.5px}
.btn:active{transform:translateY(3px)}
.btn-g{background:var(--green);color:#fff;box-shadow:var(--shadow) var(--green-d)}
.btn-b{background:var(--blue);color:#fff;box-shadow:var(--shadow) var(--blue-d)}
.btn-p{background:var(--purple);color:#fff;box-shadow:var(--shadow) var(--purple-d)}
.btn-o{background:var(--orange);color:#fff;box-shadow:var(--shadow) var(--orange-d)}
.btn-t{background:var(--teal);color:#fff;box-shadow:var(--shadow) var(--teal-d)}
.btn-ol{background:var(--bg2);color:var(--text);border:2px solid var(--bg3);box-shadow:var(--shadow) var(--bg3)}
.btn-sm{padding:10px 18px;font-size:.85em;border-radius:var(--rs)}
.btn-f{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.cd{background:var(--bg2);border:2px solid var(--bg3);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 2px 0 var(--bg3)}
.ws{text-align:center;padding:40px 16px;animation:bi .6s cubic-bezier(.2,.8,.3,1.2)}
.ws h1{font-family:'Fredoka';font-size:2.6em;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ws .sub{color:var(--text2);font-size:1.05em;font-weight:600;margin-bottom:24px}
.msc{font-size:4em;display:block;margin-bottom:12px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bi{0%{opacity:0;transform:scale(.7) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
@keyframes gl{0%,100%{box-shadow:0 0 8px rgba(88,204,2,.3)}50%{box-shadow:0 0 20px rgba(88,204,2,.6)}}
@keyframes up{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:.6}}
.ws input{width:100%;max-width:320px;padding:14px 16px;background:var(--bg);border:2px solid var(--bg3);border-radius:var(--r);font-family:'Nunito';font-size:1em;font-weight:600;color:var(--text);outline:none;text-align:center;margin-bottom:16px}
.ws input:focus{border-color:var(--green)}
.hst{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.hst .sc{flex:1;min-width:65px;background:var(--bg2);border:2px solid var(--bg3);border-radius:var(--rs);padding:10px 4px;text-align:center}
.sc .sv{font-family:'Fredoka';font-size:1.4em;font-weight:700;line-height:1}
.sc .sl{font-size:.65em;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.nc{background:linear-gradient(135deg,var(--green-l),var(--blue-l));border:2px solid var(--green);border-radius:var(--r);padding:16px;margin-bottom:14px;cursor:pointer;transition:all .2s;animation:gl 2s ease-in-out infinite}
.nc:hover{transform:translateY(-2px)}
.nc .nl{font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--green-d);margin-bottom:2px}
.nc .nt{font-family:'Fredoka';font-weight:600;font-size:1.05em;margin-bottom:2px}
.nc .nd{font-size:.8em;color:var(--text2);font-weight:600}
.wk{background:var(--bg2);border:2px solid var(--bg3);border-radius:var(--r);padding:14px;margin-bottom:14px}
.wk-title{font-family:'Fredoka';font-weight:600;font-size:.9em;margin-bottom:10px;color:var(--text)}
.wk-bars{display:flex;flex-direction:column;gap:6px}
.wk-row{display:flex;align-items:center;gap:8px}
.wk-label{font-size:.75em;font-weight:700;min-width:28px;text-align:center}
.wk-bar{flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
.wk-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.3,1.2)}
.wk-pct{font-size:.7em;font-weight:800;min-width:32px;text-align:right;font-family:'Fredoka'}
.as{margin-bottom:16px}
.ah{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:var(--rs);margin-bottom:8px;font-family:'Fredoka';font-weight:600;font-size:.9em;color:#fff}
.ah .ap{margin-left:auto;font-family:'Nunito';font-size:.75em;font-weight:800;opacity:.85}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk{background:var(--bg2);border:2.5px solid var(--bg3);border-radius:var(--rs);padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.sk:hover:not(.lk){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.sk .si{font-size:1.4em;display:block;margin-bottom:3px}
.sk .sn{font-weight:700;font-size:.72em;line-height:1.2}
.sk .ss{margin-top:3px;font-size:.68em;letter-spacing:1px}
.sk.ma{border-color:var(--amber);background:var(--amber-l)}
.sk.lk{opacity:.4;cursor:default;border-style:dashed}
.sk.lk .si{filter:grayscale(1)}
.sk.nu{border-color:var(--green);animation:up 1.5s ease-in-out infinite}
.sk.wk-sk{border-color:var(--red);background:var(--red-l);animation:up 2s ease-in-out infinite}
.sk.adv{border-color:var(--purple);background:linear-gradient(135deg,var(--purple-l),#f0e6ff);border-width:3px}
.sk .sb{position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;font-size:.58em;font-weight:800;padding:2px 6px;border-radius:10px;animation:pop .3s}
.sk .sr{font-size:.6em;color:var(--text3);font-weight:600;margin-top:2px}
.sq{font-family:'Fredoka';font-size:1em;font-weight:500;color:var(--text2);margin-bottom:4px}
.ss2{background:var(--bg);border:2px solid var(--bg3);border-radius:var(--r);padding:16px;margin-bottom:16px;font-size:.95em;line-height:1.6;font-weight:600}
.sr2{background:var(--bg);border-left:4px solid var(--blue);border-radius:0 var(--rs) var(--rs) 0;padding:12px 16px;margin-bottom:16px;font-size:.9em;line-height:1.55;font-style:italic}
.ops{display:flex;flex-direction:column;gap:8px}
.op{padding:14px 16px;border:2.5px solid var(--bg3);border-radius:var(--rs);cursor:pointer;transition:all .12s;font-weight:700;font-size:.9em;display:flex;align-items:center;gap:10px;background:var(--bg2);user-select:none}
.op:hover:not(.dis){border-color:#bbb;transform:translateY(-1px)}
.op .om{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8em;font-weight:800;transition:all .15s}
.op.cor{border-color:var(--green);background:var(--green-l);animation:pop .3s}
.op.cor .om{border-color:var(--green);background:var(--green);color:#fff}
.op.wrg{border-color:var(--red);background:var(--red-l);animation:sh .3s}
.op.wrg .om{border-color:var(--red);background:var(--red);color:#fff}
.op.dis{pointer-events:none;opacity:.6}
.op.rc{border-color:var(--green);background:var(--green-l)}
.op.rc .om{border-color:var(--green);background:var(--green);color:#fff}
.os{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.oi{padding:14px 16px;background:var(--bg2);border:2.5px solid var(--bg3);border-radius:var(--rs);font-weight:700;font-size:.86em;display:flex;align-items:center;gap:10px;user-select:none;transition:all .15s}
.oi .on{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:800;flex-shrink:0}
.oi .oa{display:flex;flex-direction:column;gap:2px;margin-left:auto;flex-shrink:0}
.oi .oa button{background:none;border:1.5px solid var(--bg3);border-radius:6px;width:26px;height:22px;cursor:pointer;font-size:.7em;display:flex;align-items:center;justify-content:center}
.oi .oa button:hover{border-color:var(--blue);color:var(--blue)}
.fb{position:fixed;bottom:0;left:0;right:0;padding:16px;z-index:200;animation:su .3s}
.fb.fc{background:var(--green-l);border-top:2px solid var(--green)}
.fb.fw{background:var(--red-l);border-top:2px solid var(--red)}
.fi{max-width:600px;margin:0 auto}
.fb .ft{font-family:'Fredoka';font-weight:600;font-size:1.1em;margin-bottom:4px}
.fb.fc .ft{color:var(--green-d)}
.fb.fw .ft{color:var(--red-d)}
.fb .fx{font-size:.88em;line-height:1.5;font-weight:600;color:var(--text);margin-bottom:12px}
.res{text-align:center;animation:bi .6s}
.res h2{font-family:'Fredoka';font-size:1.8em;margin-bottom:6px}
.rm{font-size:4em;margin-bottom:8px;display:block}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.rs{background:var(--bg2);border:2px solid var(--bg3);border-radius:var(--rs);padding:14px 8px}
.rs .rv{font-family:'Fredoka';font-size:1.5em;font-weight:700}
.rs .rl{font-size:.72em;font-weight:700;color:var(--text2);text-transform:uppercase}
.cp{position:fixed;top:-20px;width:10px;height:10px;border-radius:2px;z-index:300;animation:cf 2s ease-in forwards}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.qc{padding:14px;border:2.5px solid var(--bg3);border-radius:var(--rs);text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2);min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.qc:hover:not(.dis){border-color:#bbb;transform:scale(1.02)}
.qc .qt{font-family:'Fredoka';font-weight:600;font-size:.8em}
.qc .qd{font-size:.68em;color:var(--text2);font-weight:600}
.qc.cor{border-color:var(--green);background:var(--green-l)}
.qc.wrg{border-color:var(--red);background:var(--red-l)}
.qc.dis{pointer-events:none;opacity:.6}
.ut{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border:2px solid var(--green);border-radius:var(--r);padding:14px 24px;z-index:300;animation:bi .5s;box-shadow:0 8px 30px rgba(0,0,0,.15);text-align:center;max-width:320px}
.snd{position:fixed;bottom:16px;right:16px;z-index:150;background:var(--bg2);border:2px solid var(--bg3);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1em;box-shadow:0 2px 0 var(--bg3)}
/* WIKI */
.wiki-toggle{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 16px;border:2.5px solid var(--blue);border-radius:var(--rs);background:linear-gradient(135deg,var(--blue-l),#e8f4fd);cursor:pointer;font-family:'Fredoka';font-weight:700;font-size:1.1em;color:var(--blue-d);transition:all .15s;margin-bottom:14px;width:100%;text-align:center}
.wiki-toggle:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(28,176,246,.2)}
.wiki-toggle .wiki-sub{font-family:'Nunito';font-size:.65em;font-weight:600;color:var(--text2);text-transform:none;letter-spacing:0}
.wiki-box{display:none;margin-bottom:16px;animation:su .3s}
.wiki-box.open{display:block}
.wiki-synth{padding:14px;border-radius:var(--rs);margin-bottom:10px;font-size:.88em;line-height:1.6;font-weight:600}
.wiki-aut{font-size:.78em;font-weight:700;color:var(--text2);margin-bottom:8px;padding:0 4px}
.wiki-teo{border-left:3px solid var(--blue);padding:10px 14px;margin-bottom:10px;font-style:italic;font-size:.82em;line-height:1.55;color:var(--text2);background:var(--bg);border-radius:0 var(--rs) var(--rs) 0}
.wiki-lib{background:var(--bg2);border:1.5px solid var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.wiki-lib strong{font-size:.85em}
.wiki-lib .wl-m{color:var(--text3);font-size:.78em}
.wiki-lib .wl-n{color:var(--text2);font-size:.78em;font-style:italic}
.wiki-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.wiki-tag{padding:3px 10px;border-radius:20px;font-size:.68em;font-weight:700}
@media(max-width:480px){.ws h1{font-size:2em}.c{padding:10px;padding-bottom:100px}.sg{grid-template-columns:repeat(3,1fr);gap:6px}.sk{padding:10px 6px}.sk .si{font-size:1.2em}.sk .sn{font-size:.68em}.hst{gap:6px}.sc{padding:8px 2px}.sc .sv{font-size:1.2em}}
</style>
</head>

<div class="topbar" id="topbar" style="display:none">
  <button class="tb-b" onclick="goBack()">←</button>

</div>

<script>
/* ═══ AUDIO ═══ */
let aC=null,sOn=true;
function iA(){if(!aC)aC=new(window.AudioContext||window.webkitAudioContext)()}
function pT(f,d,t='sine',v=.06){if(!sOn||!aC)return;try{const o=aC.createOscillator(),g=aC.createGain();o.type=t;o.frequency.setValueAtTime(f,aC.currentTime);g.gain.setValueAtTime(v,aC.currentTime);g.gain.exponentialRampToValueAtTime(.001,aC.currentTime+d);o.connect(g);g.connect(aC.destination);o.start();o.stop(aC.currentTime+d)}catch(e){}}
function sT(){pT(600,.05,'sine',.04);setTimeout(()=>pT(900,.04,'sine',.03),40)}
function sC(){pT(523,.08,'sine',.06);setTimeout(()=>pT(659,.08,'sine',.06),80);setTimeout(()=>pT(784,.14,'sine',.07),160)}
function sW(){pT(300,.2,'sawtooth',.03);setTimeout(()=>pT(220,.25,'sawtooth',.03),100)}
function sL(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>pT(f,.12,'sine',.05),i*100))}
function sF(){[784,988,1175,1319,1568].forEach((f,i)=>setTimeout(()=>pT(f,.1,'sine',.04),i*80))}
function sU(){[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>pT(f,.15,'sine',.06),i*120))}
function togSnd(){iA();sOn=!sOn;document.getElementById('sndB').textContent=sOn?'🔊':'🔇'}

/* ═══ UTILS ═══ */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function fill(tpl,slots){let s=tpl;for(const[k,v]of Object.entries(slots))s=s.replace(new RegExp('\\{'+k+'\\}','g'),typeof v==='object'?pick(v):v);return s}

/* ═══ DATA: AREAS ═══ */
const AREAS=[
  {id:1,name:'Comunicazione & Relazioni',icon:'💬',c:'var(--a1)',cd:'var(--a1d)',cl:'var(--a1l)',w:.40},
  {id:2,name:'Emozioni & Leadership',icon:'💜',c:'var(--a2)',cd:'var(--a2d)',cl:'var(--a2l)',w:.25},
  {id:3,name:'Problem Solving',icon:'🧩',c:'var(--a3)',cd:'var(--a3d)',cl:'var(--a3l)',w:.25},
  {id:4,name:'Meta-skill',icon:'⚡',c:'var(--a4)',cd:'var(--a4d)',cl:'var(--a4l)',w:.10}
];

/* ═══ TEMPLATE SLOTS ═══ */
const ACTORS=['Il tutor','La responsabile','Un collega','Il responsabile del progetto','La coordinatrice','Il team leader'];
const CONTEXTS=['in riunione','via email','durante la pausa','davanti al team','in privato','al telefono','in chat di lavoro'];
const TASKS_URG=['rispondere a un reclamo del cliente','consegnare il report entro oggi','risolvere un guasto tecnico bloccante','gestire un\'emergenza logistica'];
const TASKS_IMP=['pianificare la formazione trimestrale','aggiornare il CV','leggere un libro di settore','preparare un piano B per il progetto','sviluppare una nuova competenza'];
const TASKS_DEL=['rispondere a un\'email di aggiornamento interno','compilare un modulo che un collega può fare','partecipare a una riunione che non ti riguarda'];
const TASKS_ELIM=['controllare i social durante il lavoro','rispondere a spam promozionale','riordinare le icone del desktop','guardare video non correlati al lavoro'];

/* ═══ WIKI DATA ═══ */
var WIKI={
stili:{s:"L'assertivit\u00e0 non \u00e8 il punto medio tra passivo e aggressivo: \u00e8 una terza dimensione che include rispetto di s\u00e9, rispetto dell'altro e capacit\u00e0 di proporre alternative.",a:"Salter (1949), Wolpe (1958), Alberti & Emmons (1970)",t:"Andrew Salter introdusse il concetto di personalit\u00e0 eccitatoria nel 1949. Joseph Wolpe lo formalizz\u00f2 come assertive behavior nel 1958. Alberti ed Emmons nel 1970 pubblicarono il primo manuale pratico, definendo l'assertivit\u00e0 come espressione diretta dei propri diritti senza violare quelli altrui.",l:[{t:"Your Perfect Right",a:"Alberti & Emmons",y:"1970",n:"Il testo fondativo dell'assertivit\u00e0 moderna"},{t:"The Practice of Behavior Therapy",a:"Joseph Wolpe",y:"1969",n:"Basi cliniche del training assertivo"},{t:"Conditioned Reflex Therapy",a:"Andrew Salter",y:"1949",n:"Prima formulazione del concetto"}],k:["assertivit\u00e0","comunicazione","diritti personali","Wolpe","Salter"]},
cnv:{s:"La CNV \u00e8 un processo in 4 passi (Osservazione, Sentimento, Bisogno, Richiesta) che distingue il linguaggio che apre la comunicazione (finestre) da quello che la chiude (muri).",a:"Marshall Rosenberg (2003), Carl Rogers, Alfred Korzybski",t:"Rosenberg svilupp\u00f2 la CNV partendo dalla domanda: perch\u00e9 alcune persone restano empatiche in situazioni difficili? Scopr\u00ec che strutture linguistiche specifiche attivano difesa o collaborazione. La CNV integra l'empatia rogersiana con la semantica generale di Korzybski.",l:[{t:"Le parole sono finestre (oppure muri)",a:"Marshall Rosenberg",y:"2003",n:"Testo fondamentale della CNV"},{t:"On Becoming a Person",a:"Carl Rogers",y:"1961",n:"Radici dell'empatia nella CNV"},{t:"Science and Sanity",a:"Alfred Korzybski",y:"1933",n:"Semantica generale: mappa \u2260 territorio"}],k:["CNV","nonviolenza","empatia","Rosenberg","bisogni"]},
desc:{s:"Il metodo DESC (Descrivi-Esprimi-Specifica-Conseguenze) \u00e8 una procedura in 4 passi per gestire conflitti preservando la relazione.",a:"Sharon & Gordon Bower (1976)",t:"I Bower svilupparono il DESC dal training assertivo. D neutralizza la difesa (fatto, non giudizio), E crea connessione emotiva, S orienta alla soluzione, C motiva mostrando il vantaggio reciproco.",l:[{t:"Asserting Yourself",a:"Sharon & Gordon Bower",y:"1976",n:"Origine del metodo DESC"},{t:"People Skills",a:"Robert Bolton",y:"1979",n:"Integrazione DESC con ascolto attivo"}],k:["DESC","conflitti","assertivit\u00e0","feedback"]},
sbi:{s:"Il modello SBI (Situazione-Comportamento-Impatto) separa il feedback dal giudizio: descrive quando/dove, cosa hai osservato, e quale effetto ha avuto.",a:"Center for Creative Leadership, Weitzel (2000)",t:"Il CCL svilupp\u00f2 SBI come alternativa ai feedback valutativi. Il Behavior deve essere filmabile, non un'interpretazione. Questo sposta il feedback dal piano dell'identit\u00e0 al piano del comportamento.",l:[{t:"Feedback That Works",a:"Center for Creative Leadership",y:"2000",n:"Manuale SBI originale"},{t:"Thanks for the Feedback",a:"Stone & Heen",y:"2014",n:"Ricevere feedback efficacemente"}],k:["SBI","feedback","comportamento osservabile","CCL"]},
emotions:{s:"Distinguere pensieri, emozioni, bisogni e reazioni \u00e8 il primo passo dell'intelligenza emotiva. Senza questa distinzione, si reagisce automaticamente.",a:"Ekman (1972), Plutchik (1980), Damasio (1994), Feldman Barrett (2017)",t:"Ekman identific\u00f2 6 emozioni universali. Damasio dimostr\u00f2 che le emozioni sono indispensabili per le decisioni razionali. Feldman Barrett propose che le emozioni sono costruzioni del cervello, non reazioni automatiche.",l:[{t:"L'errore di Cartesio",a:"Antonio Damasio",y:"1994",n:"Emozioni e decisioni razionali"},{t:"How Emotions Are Made",a:"Lisa Feldman Barrett",y:"2017",n:"Teoria costruzionista delle emozioni"},{t:"Emotions Revealed",a:"Paul Ekman",y:"2003",n:"Riconoscere le emozioni"}],k:["emozioni","Damasio","Ekman","autoconsapevolezza","marcatore somatico"]},
coping:{s:"L'autoregolazione non \u00e8 sopprimere le emozioni ma gestirle: riconoscere, accettare, scegliere una risposta funzionale invece di una reazione automatica.",a:"Lazarus & Folkman (1984), Linehan DBT (1993), Kabat-Zinn MBSR (1990)",t:"Lazarus e Folkman distinsero coping centrato sul problema e coping centrato sull'emozione. La DBT di Linehan insegna tolleranza e regolazione emotiva. Il MBSR usa la mindfulness per creare spazio tra stimolo e risposta.",l:[{t:"Stress, Appraisal, and Coping",a:"Lazarus & Folkman",y:"1984",n:"Modello transazionale dello stress"},{t:"Cognitive-Behavioral Treatment of BPD",a:"Marsha Linehan",y:"1993",n:"Fondamenti della DBT"},{t:"Full Catastrophe Living",a:"Jon Kabat-Zinn",y:"1990",n:"MBSR e mindfulness applicata"}],k:["coping","stress","mindfulness","DBT","autoregolazione"]},
empatia:{s:"L'empatia attiva non \u00e8 sentire quello che sente l'altro, ma comunicargli che hai capito cosa sente, senza giudicare, consigliare o spostare il focus su di te.",a:"Carl Rogers (1961), Thomas Gordon (1970), Daniel Goleman (1995)",t:"Rogers defin\u00ec l'empatia come comprendere il mondo interno dell'altro dal suo punto di vista. Gordon identific\u00f2 12 blocchi alla comunicazione che impediscono l'ascolto empatico. Goleman la incluse come componente centrale dell'EQ.",l:[{t:"On Becoming a Person",a:"Carl Rogers",y:"1961",n:"Empatia come condizione di cambiamento"},{t:"Parent Effectiveness Training",a:"Thomas Gordon",y:"1970",n:"I 12 blocchi alla comunicazione"},{t:"Intelligenza Emotiva",a:"Daniel Goleman",y:"1995",n:"Empatia come competenza sociale"}],k:["empatia","Rogers","Gordon","ascolto","12 blocchi"]},
fatto_opinione:{s:"Distinguere fatti verificabili, opinioni soggettive e interpretazioni inferenziali \u00e8 la base del pensiero critico.",a:"Korzybski (1933), Hayakawa (1939), Ellis (1962), Paul & Elder (2001)",t:"Korzybski insegn\u00f2 che la mappa non \u00e8 il territorio. Hayakawa svilupp\u00f2 la scala di astrazione. Ellis mostr\u00f2 con il modello ABC che non sono gli eventi a causare le emozioni, ma le interpretazioni.",l:[{t:"Language in Thought and Action",a:"S.I. Hayakawa",y:"1939",n:"Scala di astrazione"},{t:"Reason and Emotion in Psychotherapy",a:"Albert Ellis",y:"1962",n:"Modello ABC"},{t:"Critical Thinking",a:"Paul & Elder",y:"2001",n:"Standard del pensiero critico"}],k:["pensiero critico","fatto","opinione","Korzybski","Hayakawa","ABC"]},
pdca:{s:"Il ciclo PDCA (Plan-Do-Check-Act) \u00e8 un metodo iterativo per il miglioramento continuo: ogni miglioramento \u00e8 un esperimento.",a:"Shewhart (1939), Deming (1982), Ohno (TPS)",t:"Shewhart introdusse il ciclo nel controllo qualit\u00e0. Deming lo diffuse in Giappone dove divenne la base del Toyota Production System. Plan = ipotesi, Do = test, Check = dati, Act = decisione. Il ciclo non finisce mai.",l:[{t:"Out of the Crisis",a:"W. Edwards Deming",y:"1982",n:"PDCA e qualit\u00e0 totale"},{t:"Toyota Production System",a:"Taiichi Ohno",y:"1988",n:"PDCA applicato alla produzione"}],k:["PDCA","Deming","miglioramento continuo","Shewhart","Toyota"]},
ascolto_attivo:{s:"L'ascolto attivo \u00e8 un processo in cui comunichi all'altro che stai comprendendo il suo messaggio, evitando i 12 blocchi che chiudono la comunicazione.",a:"Carl Rogers (1951), Thomas Gordon (1970), Robert Bolton (1979)",t:"Rogers identific\u00f2 3 condizioni: empatia, accettazione incondizionata, congruenza. Gordon catalog\u00f2 12 risposte tipiche che bloccano la comunicazione (ordinare, minacciare, moralizzare, consigliare, giudicare, ecc.). Bolton sintetizz\u00f2 le tecniche in: attenzione, rispecchiamento, parafrasi, domande aperte.",l:[{t:"Client-Centered Therapy",a:"Carl Rogers",y:"1951",n:"Ascolto empatico come strumento"},{t:"Parent Effectiveness Training",a:"Thomas Gordon",y:"1970",n:"I 12 blocchi"},{t:"People Skills",a:"Robert Bolton",y:"1979",n:"Manuale pratico di ascolto attivo"}],k:["ascolto attivo","Rogers","Gordon","parafrasi","rispecchiamento"]},
star:{s:"STAR (Situazione-Task-Azione-Risultato) struttura la comunicazione delle proprie esperienze in modo concreto e misurabile.",a:"McClelland (1973), Spencer & Spencer (1993)",t:"McClelland dimostr\u00f2 che le competenze predittive del successo non sono i titoli ma i comportamenti osservabili. Spencer e Spencer formalizzarono il Behavioral Event Interview, da cui nasce STAR.",l:[{t:"Competence at Work",a:"Spencer & Spencer",y:"1993",n:"Modello delle competenze e BEI"},{t:"Testing for Competence Rather Than Intelligence",a:"David McClelland",y:"1973",n:"Articolo fondativo"}],k:["STAR","colloquio","competenze","McClelland","BEI"]},
goleman_eq:{s:"L'EQ secondo Goleman ha 5 componenti: autoconsapevolezza, autoregolazione, motivazione, empatia, abilit\u00e0 sociali. A differenza del QI, si pu\u00f2 sviluppare.",a:"Salovey & Mayer (1990), Goleman (1995/1998), Bradberry (2009)",t:"Salovey e Mayer definirono l'EQ come capacit\u00e0 di percepire, usare, comprendere e gestire le emozioni. Goleman la divulg\u00f2 distinguendo 5 domini interconnessi.",l:[{t:"Intelligenza Emotiva",a:"Daniel Goleman",y:"1995",n:"Il bestseller che ha diffuso il concetto"},{t:"Emotional Intelligence 2.0",a:"Bradberry & Greaves",y:"2009",n:"Test e strategie pratiche"}],k:["EQ","intelligenza emotiva","Goleman","autoconsapevolezza"]},
fiveWhy:{s:"I 5 Perch\u00e9 scavano sotto la superficie chiedendo ripetutamente perch\u00e9 fino alla causa radice. Fermarsi ai sintomi produce soluzioni temporanee.",a:"Sakichi Toyoda / Taiichi Ohno (TPS), Kaoru Ishikawa",t:"Toyoda svilupp\u00f2 la tecnica nella Toyota degli anni 50. Ishikawa complet\u00f2 l'approccio con il diagramma causa-effetto (6M: Manpower, Method, Machine, Material, Measurement, Mother Nature).",l:[{t:"Toyota Production System",a:"Taiichi Ohno",y:"1988",n:"I 5 Perch\u00e9 nel TPS"},{t:"Guide to Quality Control",a:"Kaoru Ishikawa",y:"1976",n:"Diagramma causa-effetto"}],k:["5 Perch\u00e9","causa radice","Ishikawa","Toyota","6M"]},
smart:{s:"Un obiettivo SMART \u00e8 Specifico, Misurabile, Achievable, Rilevante e Time-bound. La differenza tra un desiderio e un obiettivo \u00e8 la struttura.",a:"Doran (1981), Locke & Latham (1990), Drucker (1954)",t:"Drucker introdusse il MBO nel 1954. Doran cre\u00f2 l'acronimo SMART. Locke e Latham dimostrarono che obiettivi specifici e difficili producono performance superiori.",l:[{t:"A Theory of Goal Setting and Task Performance",a:"Locke & Latham",y:"1990",n:"La ricerca definitiva sugli obiettivi"},{t:"The Practice of Management",a:"Peter Drucker",y:"1954",n:"Origine del MBO"}],k:["SMART","obiettivi","Locke","Latham","MBO"]},
growth_mindset:{s:"Il growth mindset \u00e8 la convinzione che abilit\u00e0 e intelligenza si sviluppano con impegno e strategie. Il fixed mindset crede siano tratti innati.",a:"Carol Dweck (2006), Angela Duckworth (2016), Martin Seligman (1991)",t:"Dweck dimostr\u00f2 che chi crede nella modificabilit\u00e0 affronta le sfide, persiste dopo i fallimenti e usa il feedback. Duckworth estese il concetto con il grit.",l:[{t:"Mindset",a:"Carol Dweck",y:"2006",n:"Il testo fondativo"},{t:"Grit",a:"Angela Duckworth",y:"2016",n:"Perseveranza e passione"},{t:"Learned Optimism",a:"Martin Seligman",y:"1991",n:"Ottimismo come competenza"}],k:["growth mindset","Dweck","Duckworth","grit","resilienza"]},
eisenhower:{s:"La matrice classifica le attivit\u00e0 in 4 quadranti per urgenza e importanza. Il segreto: vivere nel Quadrante 2 (importante ma non urgente).",a:"Eisenhower (attribuito), Stephen Covey (1989)",t:"Covey sistematizz\u00f2 la matrice nei 7 Habits, dimostrando che le persone efficaci investono in prevenzione, pianificazione e sviluppo (Q2) invece di vivere in crisi permanente (Q1).",l:[{t:"The 7 Habits of Highly Effective People",a:"Stephen Covey",y:"1989",n:"Matrice Q1-Q4"},{t:"First Things First",a:"Covey, Merrill & Merrill",y:"1994",n:"Approfondimento sulla matrice"}],k:["Eisenhower","priorit\u00e0","Covey","Quadrante 2","urgente","importante"]},
pomodoro:{s:"Il Pomodoro alterna blocchi di lavoro focalizzato (25 min) a pause (5 min). Il cervello lavora meglio in sprint brevi con recupero.",a:"Francesco Cirillo (2018), David Allen GTD (2001), Cal Newport (2016)",t:"Cirillo svilupp\u00f2 la tecnica negli anni 80. L'attenzione sostenuta ha un costo metabolico crescente; le pause permettono al default mode network di consolidare.",l:[{t:"The Pomodoro Technique",a:"Francesco Cirillo",y:"2018",n:"Il metodo originale"},{t:"Deep Work",a:"Cal Newport",y:"2016",n:"Concentrazione profonda"}],k:["Pomodoro","focus","produttivit\u00e0","Cirillo","Deep Work"]},
scqa:{s:"SCQA (Situazione-Complicazione-Domanda-Risposta) struttura qualsiasi argomentazione partendo dal contesto condiviso fino alla proposta.",a:"Barbara Minto (1987), McKinsey & Company",t:"Minto svilupp\u00f2 il metodo in McKinsey per strutturare memo e presentazioni. La Situazione stabilisce il terreno comune, la Complicazione introduce il problema, la Domanda \u00e8 quella che il pubblico si pone, la Risposta \u00e8 la tua proposta. L'ordine \u00e8 cruciale: crea tensione narrativa.",l:[{t:"The Minto Pyramid Principle",a:"Barbara Minto",y:"1987",n:"Il testo originale"},{t:"The Pyramid Principle",a:"Barbara Minto",y:"2009",n:"Edizione aggiornata"}],k:["SCQA","argomentazione","Minto","McKinsey","presentazioni"]},
pyramid:{s:"Il Pyramid Principle impone di comunicare top-down: prima la conclusione, poi le motivazioni, poi i dettagli. L'opposto di come pensiamo naturalmente.",a:"Barbara Minto (1987), McKinsey & Company",t:"Minto osserv\u00f2 che la comunicazione bottom-up (premessa \u2192 ragionamento \u2192 conclusione) perde l'attenzione del destinatario. Il top-down (conclusione \u2192 motivazione \u2192 dettagli) rispetta il tempo dell'altro e rende il messaggio immediatamente utile.",l:[{t:"The Pyramid Principle",a:"Barbara Minto",y:"2009",n:"Comunicazione top-down strutturata"},{t:"Pyramid Principle",a:"Barbara Minto",y:"1987",n:"Prima edizione"}],k:["Pyramid","top-down","Minto","conclusione","struttura"]},
leadership_sit:{s:"Non esiste uno stile di leadership migliore in assoluto. Lo stile efficace dipende dalla situazione, dalla maturit\u00e0 del collaboratore e dall'obiettivo.",a:"Hersey & Blanchard (1969), Daniel Goleman (2000), Vroom & Yetton (1973)",t:"Hersey e Blanchard definirono 4 stili (Direttivo, Coaching, Supportivo, Delegante) in funzione della competenza e motivazione del collaboratore. Goleman identific\u00f2 6 stili (Visionario, Coach, Affiliativo, Democratico, Battistrada, Autoritario) e dimostr\u00f2 che i leader pi\u00f9 efficaci ne usano almeno 4.",l:[{t:"Management of Organizational Behavior",a:"Hersey & Blanchard",y:"1969",n:"Leadership situazionale"},{t:"Leadership That Gets Results",a:"Daniel Goleman",y:"2000",n:"I 6 stili su HBR"},{t:"Primal Leadership",a:"Goleman, Boyatzis, McKee",y:"2002",n:"Leadership e intelligenza emotiva"}],k:["leadership","situazionale","Hersey","Blanchard","Goleman","6 stili"]},
ooda:{s:"OODA (Observe-Orient-Decide-Act) \u00e8 un ciclo decisionale per contesti incerti e veloci. Chi completa il ciclo pi\u00f9 rapidamente ha il vantaggio.",a:"John Boyd (1976), Chet Richards (2004)",t:"Boyd, pilota militare, teorizz\u00f2 che la superiorit\u00e0 non viene dalla forza ma dalla velocit\u00e0 decisionale. Orient \u00e8 la fase pi\u00f9 critica: \u00e8 dove i bias, l'esperienza e la cultura filtrano l'osservazione. Un Orient sbagliato produce decisioni veloci ma errate.",l:[{t:"Certain to Win",a:"Chet Richards",y:"2004",n:"OODA applicato al business"},{t:"Boyd: The Fighter Pilot Who Changed the Art of War",a:"Robert Coram",y:"2002",n:"Biografia e teoria di Boyd"}],k:["OODA","Boyd","decisioni","incertezza","agilit\u00e0"]}
};

{id:'stili',ps:12,area:1,name:'Stili comunicativi',icon:'🗣️',tier:0,req:null,
 labels:{passivo:'🟡 Passivo',aggressivo:'🔴 Aggressivo',assertivo:'🟢 Assertivo'},
 gen(seed){
  const scenarios=[
    {s:'{actor} ti chiede di restare mezz\'ora in più. Hai un impegno.',
     r:[{t:'{resp_passivo}',c:'passivo',fb:'Eviti il confronto e accumuli frustrazione. Passivo.'},{t:'{resp_aggressivo}',c:'aggressivo',fb:'Attacco diretto con etichette. Aggressivo.'},{t:'{resp_assertivo}',c:'assertivo',fb:'Riconosci il bisogno, esprimi il vincolo, proponi alternativa. Assertivo.'}],
     rp:['Accetti in silenzio e ti lamenti con i colleghi dopo.','Dici "va bene" con tono rassegnato e annulli il tuo impegno.','Annuisci senza dire niente e mandi un messaggio passivo-aggressivo.'],
     ra:['"Sono stufo di questi cambi! Non sono il tuo schiavo!"','"Ogni volta la stessa storia, non si può lavorare così!"','"Sempre io devo fare straordinari, è inaccettabile!"'],
     rs:['"Capisco l\'urgenza. Oggi ho un impegno alle 18. Posso arrivare prima domani?"','"Mi farebbe piacere aiutare, ma oggi non posso restare. Possiamo trovare un\'alternativa?"','"Ho un vincolo oggi. Propongo di completare domani mattina come prima cosa."']},
    {s:'{actor} si prende il merito della tua idea {context}.',
     r:[{t:'{resp_passivo}',c:'passivo',fb:'Non dici niente: evitamento classico. Passivo.'},{t:'{resp_aggressivo}',c:'aggressivo',fb:'Attacco alla persona con etichette. Aggressivo.'},{t:'{resp_assertivo}',c:'assertivo',fb:'Fatto specifico + proposta collaborativa. Assertivo.'}],
     rp:['Non dici niente ma eviti il collega per il resto della settimana.','Sospiri e te ne vai, lamentandoti in corridoio.','Fai finta di niente ma ci rimugini per giorni.'],
     ra:['"Sei il solito furbo! Non rubare mai più le mie idee!"','"Complimenti per il plagio, davvero professionale."','"Ma chi credi di prendere in giro?"'],
     rs:['"Volevo precisare che questa proposta l\'avevo presentata io. Possiamo svilupparla insieme?"','"L\'idea parte dal mio lavoro della settimana scorsa. Mi farebbe piacere collaborare."','"Questa è la proposta che avevo condiviso con te. Lavoriamoci insieme?"']},
    {s:'{actor} ti assegna un compito che non sai fare.',
     r:[{t:'{resp_passivo}',c:'passivo',fb:'Non chiedi aiuto apertamente. Passivo.'},{t:'{resp_aggressivo}',c:'aggressivo',fb:'Rifiuto ostile senza apertura. Aggressivo.'},{t:'{resp_assertivo}',c:'assertivo',fb:'Ammetti il limite e chiedi supporto concreto. Assertivo.'}],
     rp:['Annuisci e chiedi aiuto a un collega di nascosto.','Dici "certo" ma poi non sai da dove cominciare e ti blocchi.','Accetti e speri di capirlo guardando su internet.'],
     ra:['"Non è nel mio contratto! Non mi pagano abbastanza per questo."','"Ma perché tocca sempre a me le cose impossibili?"','"Se vuoi che lo faccia, allora insegnami, no?"'],
     rs:['"Non ho esperienza con questo. Posso avere un\'ora di affiancamento?"','"Ci provo volentieri, ma avrei bisogno di una guida iniziale. Puoi indicarmi qualcuno?"','"È un compito nuovo per me. Posso avere un riferimento da seguire?"']},
    {s:'{actor} ti interrompe sistematicamente {context}.',
     r:[{t:'{resp_passivo}',c:'passivo',fb:'Cedi lo spazio comunicativo. Passivo.'},{t:'{resp_aggressivo}',c:'aggressivo',fb:'Attacco diretto. Aggressivo.'},{t:'{resp_assertivo}',c:'assertivo',fb:'Fatto specifico + richiesta chiara. Assertivo.'}],
     rp:['Abbassi la voce e smetti di parlare.','Ti rassegni e aspetti che finisca.','Non dici niente ma sei irritato tutto il giorno.'],
     ra:['"Possibile che non riesci a stare zitto per due minuti?"','"Sei maleducato! Non si interrompe!"','"Basta! Mi hai interrotto per l\'ultima volta!"'],
     rs:['"Mi hai interrotto diverse volte. Vorrei finire il mio punto, poi ascolto volentieri il tuo."','"Posso completare? Dopo sono tutto orecchie."','"Scusa, stavo finendo un concetto importante. Poi ti lascio la parola."']},
    {s:'{actor} ti critica duramente {context}.',
     r:[{t:'{resp_passivo}',c:'passivo',fb:'Non esprimi il tuo disagio. Passivo.'},{t:'{resp_aggressivo}',c:'aggressivo',fb:'Controattacco senza dialogo. Aggressivo.'},{t:'{resp_assertivo}',c:'assertivo',fb:'Esprimi il disagio + chiedi costruttivamente. Assertivo.'}],
     rp:['"Ha ragione, mi scuso" anche se la critica era sproporzionata.','Non rispondi e vai a lamentarti con altri.','Annuisci e ti chiudi in te stesso.'],
     ra:['"Se non le sta bene, trovati un altro!"','"Non ha il diritto di parlarmi così!"','"Facile criticare, provi lei a fare il mio lavoro!"'],
     rs:['"Apprezzo il feedback. Possiamo vederlo insieme per capire dove migliorare?"','"La critica mi ha colpito. Preferirei discuterne in privato per trovare una soluzione."','"Capisco il problema. Mi aiuta indicarmi concretamente cosa correggere?"']}
  ];
  const sc=scenarios[seed%scenarios.length];
  const actor=ACTORS[seed%ACTORS.length];
  const ctx=CONTEXTS[(seed*7)%CONTEXTS.length];
  const scenario=fill(sc.s,{actor,context:ctx});
  const variant=sc.r[seed%sc.r.length];
  let response;
  if(variant.c==='passivo')response=pick(sc.rp);
  else if(variant.c==='aggressivo')response=pick(sc.ra);
  else response=pick(sc.rs);
  return{type:'classify',scenario,response,correct:variant.c,
    feedback:{passivo:variant.c==='passivo'?variant.fb:'No — '+(['qui c\'è evitamento','non c\'è attacco','non stai comunicando il bisogno'][seed%3]),
              aggressivo:variant.c==='aggressivo'?variant.fb:'No — '+(['qui c\'è attacco diretto','non stai evitando','mancano rispetto e proposta'][seed%3]),
              assertivo:variant.c==='assertivo'?variant.fb:'No — '+(['qui c\'è negoziazione','stai comunicando chiaramente','è una richiesta costruttiva'][seed%3])}};
}},

{id:'cnv',ps:14,area:1,name:'Muri e Finestre',icon:'🪟',tier:1,req:'stili',
 labels:{muro:'🧱 Muro',finestra:'🪟 Finestra'},
 gen(seed){
  const pairs=[
    {s:'Un collega non ti ha avvisato di un cambio di orario.',
     m:['"Non ti importa mai degli altri!"','"Sei il solito menefreghista!"','"Nessuno mi avvisa mai!"','"Mi sento ignorato da te."','"Come al solito, a nessuno importa."'],
     f:['"Non mi hai comunicato il cambio. Mi sento frustrato."','"Non ho ricevuto l\'avviso. Ho bisogno di essere informato per organizzarmi."','"Quando non ricevo l\'aggiornamento, mi sento in difficoltà. Puoi avvisarmi?"'],
     mfb:'Generalizzazione o giudizio = muro. Manca il fatto specifico.',
     ffb:'Osservazione specifica + sentimento vero + richiesta. Finestra.'},
    {s:'{actor} dice che il tuo lavoro non è all\'altezza.',
     m:['"Mi sento incompetente."','"Mi sento un fallimento."','"Penso di non valere niente."','"Mi sento non valorizzato da te."','"Mi fai sempre sentire inadeguato!"'],

     ffb:'Dato concreto + sentimento vero + proposta strutturale.'},

     ffb:'Dato temporale + bisogno di orientamento + richiesta specifica e fattibile.'}
  ];
  const p=pairs[seed%pairs.length];
  const actor=ACTORS[seed%ACTORS.length];
  const scenario=fill(p.s,{actor});
  const isMuro=seed%2===0;
  return{type:'classify',scenario,response:isMuro?pick(p.m):pick(p.f),correct:isMuro?'muro':'finestra',

}},

{id:'desc',ps:11,area:1,name:'Metodo DESC',icon:'📐',tier:2,req:'cnv',
 gen(seed){

    return{type:'order',instruction:'Riordina i passi del metodo DESC nella sequenza corretta:',
      steps:['Descrivi il fatto in modo neutro, come una telecamera','Esprimi come ti senti in prima persona','Specifica cosa vorresti che cambiasse','Indica le conseguenze positive per entrambi'],
      feedback:'DESC: Descrizione neutra → Emozione in prima persona → Specifica/richiesta → Conseguenza win-win.'};
  }
  const descs=[
    {s:'{actor} arriva in ritardo per la terza volta.',
     good:'"Le ultime tre riunioni sono iniziate in ritardo. Mi mette in difficoltà. Ti chiedo di avvisarmi se prevedi di tardare. Così il team non perde tempo."',
     bad:['"Sei sempre in ritardo! La prossima volta iniziamo senza di te."','"Dovresti essere più responsabile."','Sospiri guardando l\'orologio ma non dici niente.'],

    {s:'{actor} ti critica duramente {context}.',
     good:'"Quando mi fai notare errori davanti al team, mi sento in imbarazzo. Preferirei i feedback in privato. Così posso correggermi con attenzione."',
     bad:['"Non mi devi mai criticare davanti agli altri!"','"Ha ragione, mi scuso."','"Se vuoi umiliarmi, almeno fallo in privato."'],
     gfb:'DESC: D (davanti al team), E (imbarazzo), S (in privato), C (correzione migliore).',
     bfb:['Pretesa senza espressione del sentimento.','Passivo: non esprimi il disagio per la modalità.','Aggressivo: "umiliarmi" è interpretazione, non descrizione.']},
    {s:'{actor} ti assegna straordinari per la terza settimana consecutiva.',
     good:'"Nelle ultime tre settimane ho fatto straordinari ogni weekend. Ho bisogno di un weekend libero per recuperare. Possiamo organizzare una rotazione? Così il team è coperto e tutti recuperano."',
     bad:['"Non se ne parla! Ho già dato abbastanza."','"Ma certo, nessun problema." (tono rassegnato)','Chiedi a un collega di andare al tuo posto senza dire niente.'],
     gfb:'DESC completo: D (tre settimane consecutive), E (bisogno di recupero), S (rotazione), C (team coperto).',

     bfb:['Pretesa aggressiva senza D.','Passivo: il problema resta.','Generalizzazione che accusa tutti.']},
    {s:'{actor} ti assegna un compito senza spiegarti come farlo.',
     good:'"Mi è stato chiesto di preparare il report X entro domani. Non l\'ho mai fatto e mi sento in difficoltà. Potresti mostrarmi un esempio o indicarmi una persona di riferimento? Così lo consegno correttamente al primo tentativo."',
     bad:['"Come pretendi che faccia qualcosa che non so fare?"','"Ok, ci provo." (senza chiedere nulla)','Chiedi a un collega e speri che vada bene.'],
     gfb:'D (compito nuovo), E (difficoltà), S (esempio o riferimento), C (consegna corretta).',
     bfb:['Contrattacco senza esprimere il bisogno.','Passivo: rischi di sbagliare tutto.','Indiretto: non affronti chi ti ha dato il compito.']},
    {s:'{actor} prende decisioni che riguardano il tuo lavoro senza consultarti.',

     bad:['"Fate quello che volete, tanto nessuno mi chiede niente!"','"Va bene, mi adeguo."','"Chi ha deciso questa cosa assurda?"'],

    {s:'Un collega fa rumore con le cuffie mentre lavori in open space.',

     bad:['"Abbassa quella musica!"','"Non dici niente ma metti i tappi con fare ostentato."','"Sei proprio un maleducato."'],

     good:'"Nelle ultime email su tema X sono stato messo in copia. Non ho un ruolo nella questione e mi confonde sulle mie priorità. Puoi mettermi in copia solo quando serve il mio contributo? Così rispondo più velocemente alle cose importanti."',
     bad:['"Toglimi da queste email inutili!"','"Non leggo più niente, fate voi."','"Ma perché mi metti in mezzo?"'],
     gfb:'D (copia senza ruolo), E (confusione priorità), S (copia mirata), C (risposte più rapide).',
     bfb:['Ordine senza motivazione.','Rinuncia passiva.','Domanda retorica, non DESC.']},
    {s:'{actor} ha promesso un giorno libero ma poi ci ripensa.',
     good:'"La settimana scorsa mi avevi confermato il venerdì libero e ieri l\'hai annullato. Mi sento frustrato perché avevo già preso un impegno. Ti chiedo di confermare i giorni liberi con almeno 3 giorni di anticipo. Così posso organizzarmi e garantire la copertura."',
     bad:['"Non sei una persona di parola!"','"Figurati, nessun problema." (con risentimento)','Non dici niente ma te la ricordi per sempre.'],
     gfb:'D (promessa + annullamento), E (frustrazione), S (conferma con anticipo), C (organizzazione + copertura).',
     bfb:['Attacco alla persona senza S né C.','Passivo con accumulo di rancore.','Passivo: il risentimento cresce silenziosamente.']},
    {s:'{actor} non risponde ai tuoi messaggi di lavoro per giorni.',
     good:'"L\'ultimo messaggio su progetto Y è rimasto senza risposta per 4 giorni. Mi ha bloccato sull\'avanzamento e mi sento in ansia per la scadenza. Potresti darmi un riscontro entro 24 ore, anche solo per dire che hai bisogno di tempo? Così posso pianificare."',
     bad:['"Non rispondi mai a nessuno!"','"Lascio perdere, faccio da solo."','"È una mancanza di professionalità."'],
     gfb:'D (4 giorni senza risposta), E (ansia per scadenza), S (riscontro entro 24h), C (pianificazione).',
     bfb:['Generalizzazione falsa.','Passivo: il problema non si risolve.','Giudizio morale al posto di una richiesta.']}
  ];
  const d=descs[(seed-1)%descs.length];
  const actor=ACTORS[seed%ACTORS.length];
  const ctx=CONTEXTS[(seed*3)%CONTEXTS.length];
  const scenario=fill(d.s,{actor,context:ctx});
  const opts=[{text:d.good,correct:true,feedback:d.gfb}];
  d.bad.forEach((b,i)=>opts.push({text:b,correct:false,feedback:d.bfb[i]||d.bfb[0]}));
  return{type:'best_pick',scenario:'Applica il DESC: '+scenario,options:shuf(opts)};
}},

{id:'eisenhower',ps:13,area:4,name:'Matrice Eisenhower',icon:'📊',tier:0,req:null,

{id:'star',ps:7,area:1,name:'Metodo STAR',icon:'⭐',tier:3,req:'sbi',
 gen:function(seed){
  if(seed===0){
    return{type:'order',instruction:'Riordina i passi del metodo STAR:',
      steps:['Descrivi il contesto specifico in cui è successo','Spiega qual era il compito o la responsabilità','Racconta i passi concreti che hai fatto','Indica l\'esito misurabile che hai ottenuto'],
      feedback:'STAR: contesto -> responsabilita -> azione concreta -> risultato misurabile. Ogni passo deve essere specifico.'};
  }
  var qs=[
    {s:'Devi raccontare come hai gestito un cliente difficile. Quale risposta STAR e migliore?',
     opts:[{t:'"La settimana scorsa (S), un cliente ha contestato la fattura (T). Ho verificato i dati, trovato l\'errore e inviato la correzione in 2 ore (A). Il cliente ha confermato il pagamento il giorno dopo (R)."',c:true,fb:'STAR completo: contesto temporale, problema specifico, azione dettagliata, risultato misurabile.'},
       {t:'"Ho gestito bene il cliente arrabbiato."',c:false,fb:'Zero STAR: manca tutto. Nessun dettaglio verificabile.'},
       {t:'"Sono bravo a gestire i clienti difficili, lo faccio sempre."',c:false,fb:'Generalizzazione senza esempio concreto. Non e STAR.'},
       {t:'"Il cliente era arrabbiato ma alla fine si e calmato."',c:false,fb:'Manca T (cosa dovevi fare) e A (cosa hai fatto concretamente).'}]},
    {s:'Ti chiedono di descrivere un risultato di cui sei orgoglioso. Quale risposta STAR e migliore?',
     opts:[{t:'"Nel progetto X di marzo (S), dovevo ridurre i tempi di consegna del 20% (T). Ho analizzato il processo, eliminato 3 passaggi ridondanti e creato un template (A). I tempi sono scesi del 25% in un mese (R)."',c:true,fb:'STAR perfetto: ogni passo e specifico e misurabile.'},
       {t:'"Ho migliorato molto il processo."',c:false,fb:'Vago: quanto? Come? Quale processo?'},
       {t:'"Il mio responsabile dice che sono efficiente."',c:false,fb:'Opinione di terzi, non un esempio STAR concreto.'},
       {t:'"Ho lavorato duro e i risultati si sono visti."',c:false,fb:'Generico: mancano S, T, A e R specifici.'}]},
    {s:'Ti chiedono come hai risolto un problema di comunicazione nel team. Migliore risposta STAR?',
     opts:[{t:'"A settembre (S) il team non si coordinava sulle scadenze (T). Ho proposto una riunione settimanale di 15 minuti e creato una board condivisa (A). In un mese le scadenze rispettate sono passate dal 60% al 90% (R)."',c:true,fb:'Contesto, problema, azione concreta, risultato numerico. STAR completo.'},
       {t:'"Ho migliorato la comunicazione del team."',c:false,fb:'Come? Quando? Quanto? Nessun dato STAR.'},
       {t:'"Il team ora comunica molto meglio."',c:false,fb:'Solo R, e vago. Mancano S, T e A.'},
       {t:'"Sono una persona comunicativa, risolvo sempre questi problemi."',c:false,fb:'Tratto di personalita, non un esempio concreto.'}]},
    {s:'Descrivi una volta in cui hai imparato qualcosa di nuovo rapidamente. Migliore STAR?',
     opts:[{t:'"Quando sono arrivato in azienda (S), dovevo imparare SAP in 2 settimane (T). Ho seguito 3 tutorial, fatto pratica con dati di test e chiesto supporto al collega esperto (A). Al quindicesimo giorno ho inserito il primo ordine in autonomia senza errori (R)."',c:true,fb:'S specifico, T con scadenza, A con 3 passi concreti, R verificabile. Eccellente.'},
       {t:'"Imparo tutto in fretta, sono veloce."',c:false,fb:'Autodichiarazione senza prove. Non STAR.'},
       {t:'"Ho imparato SAP da solo."',c:false,fb:'Manca tutto: quando, quanto tempo, come, con quale risultato.'},
       {t:'"Il mio tutor ha detto che sono stato bravo a imparare."',c:false,fb:'Opinione altrui senza dati. Non e una risposta STAR.'}]},
    {s:'Racconta un momento in cui hai lavorato sotto pressione. Migliore STAR?',
     opts:[{t:'"Venerdi scorso (S) il server e crashato a 2 ore dalla consegna al cliente (T). Ho isolato il problema, ripristinato il backup e avvisato il cliente del ritardo di 30 minuti (A). Il cliente ha ricevuto tutto entro le 17 e ha confermato la soddisfazione (R)."',c:true,fb:'Pressione reale, azioni specifiche e ordinate, risultato con feedback. STAR completo.'},
       {t:'"Lavoro bene sotto pressione, sono abituato."',c:false,fb:'Affermazione generica senza esempio.'},
       {t:'"C era un problema con il server e l ho risolto."',c:false,fb:'Mancano dettagli: quando, qual era il compito, come, con quale risultato.'},
       {t:'"Il team mi chiama sempre quando c e un emergenza."',c:false,fb:'Non e un esempio STAR, e una generalizzazione sul proprio ruolo.'}]},
    {s:'Descrivi come hai gestito un disaccordo con un collega. Migliore STAR?',
     opts:[{t:'"Nel progetto Y (S), io e Marco non eravamo d accordo sulla strategia di pricing (T). Ho proposto un test A/B su 100 clienti per 2 settimane (A). I dati hanno mostrato che la sua proposta rendeva il 12% in piu e abbiamo adottato quella (R)."',c:true,fb:'STAR eccellente: il conflitto si risolve con dati, non con opinioni. Il risultato mostra flessibilita.'},
       {t:'"Alla fine avevo ragione io."',c:false,fb:'Non e STAR. E un giudizio retrospettivo senza dettagli.'},
       {t:'"Abbiamo discusso e trovato un compromesso."',c:false,fb:'Troppo generico: quale compromesso? Come ci siete arrivati?'},
       {t:'"Non litigo mai con i colleghi, sono diplomatico."',c:false,fb:'Autodichiarazione. Nessun esempio concreto.'}]}
  ];
  var q=qs[(seed-1)%qs.length];
  return{type:'best_pick',scenario:q.s,options:shuf(q.opts.map(function(o){return{text:o.t,correct:o.c,feedback:o.fb};}))};
}},

{id:'scqa',ps:5,area:1,name:'Metodo SCQA',icon:'🧩',tier:2,req:'cnv',
 gen:function(seed){
  if(seed===0){

  }

    {s:'Devi proporre al responsabile di cambiare fornitore. Come strutturi con SCQA?',
     opts:[{t:'"Attualmente usiamo il fornitore X da 3 anni (S). Negli ultimi 6 mesi le consegne sono arrivate in ritardo 4 volte, causando fermi produzione (C). Possiamo continuare a rischiare fermi? (Q) Propongo di testare il fornitore Y per 3 mesi con un ordine pilota (R)."',c:true,fb:'SCQA perfetto: contesto condiviso, problema con dati, domanda retorica, proposta concreta e graduale.'},

    {s:'Vuoi proporre al team di usare una nuova app per la gestione dei compiti. SCQA migliore?',
     opts:[{t:'"Usiamo fogli Excel per tracciare i compiti (S). Il mese scorso 3 task sono stati dimenticati perche il file non era aggiornato (C). Come evitiamo che succeda ancora? (Q) Propongo di provare Trello per 2 settimane e confrontare i risultati (R)."',c:true,fb:'S (stato attuale), C (problema con dati), Q (domanda aperta), R (proposta con periodo di test). Struttura persuasiva.'},
       {t:'"Trello e meglio di Excel, usiamolo."',c:false,fb:'Opinione senza argomentazione. Non convince chi non conosce Trello.'},
       {t:'"Excel non funziona piu."',c:false,fb:'Solo C, generico. Non proponi niente.'},
       {t:'"Ho letto che le aziende moderne usano tool digitali."',c:false,fb:'Appello all autorita generica. Non parla del vostro problema specifico.'}]},
    {s:'Devi convincere il tutor a darti piu responsabilita. SCQA?',
     opts:[{t:'"Da 4 mesi gestisco l inventario senza errori (S). Il magazzino ha anche il processo di riordino che nessuno segue (C). Chi potrebbe occuparsene? (Q) Vorrei provare a gestirlo per un mese, con un check settimanale con te (R)."',c:true,fb:'S (track record), C (problema scoperto), Q (aperta), R (proposta graduale con controllo). Persuasivo e rispettoso.'},
       {t:'"Sono pronto per fare di piu."',c:false,fb:'Autodichiarazione senza evidenze. Non e SCQA.'},
       {t:'"Mi annoio a fare sempre le stesse cose."',c:false,fb:'Lamentela, non proposta. Effetto opposto.'},
       {t:'"Il riordino va male, posso farlo io?"',c:false,fb:'Salta S (non mostri le tue credenziali) e la domanda. Troppo diretto senza contesto.'}]},
    {s:'Devi scrivere un email per proporre una nuova procedura di sicurezza. SCQA?',
     opts:[{t:'"Attualmente i visitatori accedono liberamente all area produzione (S). La settimana scorsa un visitatore e entrato senza casco in zona macchine (C). Come preveniamo incidenti? (Q) Propongo un registro accessi con DPI obbligatori e accompagnamento (R)."',c:true,fb:'Parte dal fatto condiviso, introduce il rischio concreto, pone la domanda, propone la soluzione. SCQA completo.'},
       {t:'"Serve una nuova procedura di sicurezza."',c:false,fb:'Conclusione senza S, C, Q. Non spiega perche ne cosa.'},
       {t:'"La sicurezza e importante."',c:false,fb:'Ovvieta. Nessuno e in disaccordo, ma nessuno agisce.'},
       {t:'"Un visitatore rischiava di farsi male."',c:false,fb:'Solo C parziale. Manca il contesto e la proposta.'}]}
  ];
  var q=qs[(seed-1)%qs.length];
  return{type:'best_pick',scenario:q.s,options:shuf(q.opts.map(function(o){return{text:o.t,correct:o.c,feedback:o.fb};}))};
}},

{id:'pyramid',ps:11,area:1,name:'Pyramid Principle',icon:'🔺',tier:2,req:'cnv',
 labels:{topdown:'🔺 Top-down (Pyramid)',bottomup:'⬇️ Bottom-up'},
 gen:function(seed){
  if(seed===0){
    return{type:'order',instruction:'Riordina i passi del Pyramid Principle per comunicare in modo efficace:',
      steps:['Parti dalla conclusione o richiesta principale','Fornisci le 2-3 motivazioni chiave che la sostengono','Aggiungi dettagli, dati o alternative solo se richiesti'],
      feedback:'Top-down: prima il messaggio, poi il perche, poi i dettagli. Rispetta il tempo dell interlocutore.'};
  }
  var items=[
    {r:'"Le scrivo per chiederle un giorno di ferie giovedi 15. Ho completato in anticipo le consegne e non ci sono riunioni. Luca puo coprire le urgenze."',c:'topdown',fb:'Conclusione (richiesta ferie) in apertura. Motivazioni subito dopo. Dettaglio operativo alla fine.'},
    {r:'"Dunque, vedi, c e una cosa... praticamente io giovedi avrei questo appuntamento, cioe non e che non voglio venire, pero ecco... non so se riesco..."',c:'bottomup',fb:'Bottom-up confuso. Il tutor non capisce cosa vuoi dire. Sembra un tentativo di scusa.'},
    {r:'"Propongo di cambiare il fornitore di carta. Il costo e aumentato del 30% e la qualita e peggiorata. Ho trovato un alternativa a -15% con campioni gia testati."',c:'topdown',fb:'Conclusione (cambiare fornitore), motivazione (costo +30%, qualita peggiore), dettaglio (alternativa testata). Pyramid perfetta.'},
    {r:'"Allora, ieri ho controllato le fatture, poi ho confrontato i prezzi, poi ho chiamato tre fornitori, e alla fine ho scoperto che quello attuale costa il 30% in piu... insomma, forse dovremmo cambiarlo."',c:'bottomup',fb:'Il messaggio principale arriva alla fine, dopo un racconto cronologico. Chi ascolta ha gia perso attenzione.'},
    {r:'"Il progetto sara in ritardo di 3 giorni. Il test del modulo B ha rivelato un bug critico. Ho gia assegnato la fix a Marco e prevedo chiusura entro venerdi."',c:'topdown',fb:'Impatto (ritardo), causa (bug), azione (fix + timeline). Nessun preambolo inutile.'},
    {r:'"Dunque, prima stavamo testando il modulo A che andava bene, poi siamo passati al B, li abbiamo trovato un problema, Marco ha detto che serviva tempo... insomma, forse consegnamo un po in ritardo."',c:'bottomup',fb:'Storia cronologica con conclusione nascosta in fondo. Chi legge non sa se il ritardo e di un giorno o un mese.'},
    {r:'"Chiedo di anticipare la riunione a martedi. Tre dei cinque partecipanti hanno conflitti giovedi. Martedi siamo tutti disponibili."',c:'topdown',fb:'Richiesta, motivazione, dato. Tre frasi, zero ambiguita.'},
    {r:'"Ho parlato con Luca e lui giovedi ha un corso, poi ho sentito Sara e anche lei ha un problema, anche Marco non e sicuro... forse sarebbe meglio spostare?"',c:'bottomup',fb:'Bottom-up: la richiesta arriva nascosta alla fine come domanda timida. Il destinatario non capisce se stai chiedendo o raccontando.'},
    {r:'"Il nuovo sistema di ticketing va adottato. Riduce i tempi di risposta del 40%. Il costo e coperto dal budget esistente. Allego il confronto con il sistema attuale."',c:'topdown',fb:'Conclusione diretta, 2 motivazioni (tempo + costo), dettaglio come allegato. Comunicazione da professionista.'},
    {r:'"Non so se hai visto quella email del reparto IT, comunque parlano di un sistema nuovo, io l ho guardato un po e sembra carino, costa anche meno... potremmo valutarlo?"',c:'bottomup',fb:'Nessuna struttura: si perde tra premesse, incertezze e conclusione debole.'}
  ];
  var item=items[(seed>0?seed-1:0)%items.length];
  var fb={};
  fb.topdown=item.c==='topdown'?'Esatto: '+item.fb:'No: qui la conclusione e nascosta in fondo. E bottom-up.';
  fb.bottomup=item.c==='bottomup'?'Esatto: '+item.fb:'No: qui la conclusione e in apertura. E top-down (Pyramid).';
  return{type:'classify',response:item.r,correct:item.c,feedback:fb};
}},

{id:'fiveWhy',ps:4,area:3,name:'5 Perche',icon:'🔬',tier:2,req:'pdca',
 gen:function(seed){

/* ═══ GENERATOR — FIXED SEED POOL ═══ */
function getPS(fwId){var fw=FW.find(function(f){return f.id===fwId;});return fw&&fw.ps?fw.ps:10;}
function genItem(fwId,seed){
  var fw=FW.find(function(f){return f.id===fwId;});
  if(!fw||!fw.gen)return null;
  try{var item=fw.gen(seed);if(!item)return null;item.fwId=fwId;item.area=fw.area;item.uid=fwId+'_'+seed;return item;}
  catch(e){return null;}
}

function genPool(fwId,count){
  var items=[];
  var seen=new Set();
  // PHASE 1: Leitner-priority items (box 1-2, need review)
  var leitnerSeeds=[];
  var _ps=getPS(fwId);for(var s=0;s<_ps;s++){
    var box=S.lt[fwId+'_'+s]||0;
    if(box>=1&&box<=2)leitnerSeeds.push({seed:s,box:box});
  }
  leitnerSeeds.sort(function(a,b){return a.box-b.box;});
  for(var i=0;i<leitnerSeeds.length&&items.length<count;i++){
    var item=genItem(fwId,leitnerSeeds[i].seed);
    if(!item)continue;
    var key=(item.response||item.task||item.instruction||'')+item.correct;
    if(seen.has(key))continue;
    seen.add(key);items.push(item);
  }
  // PHASE 2: Unseen items (never attempted)
  var unseenSeeds=[];
  for(var s2=0;s2<_ps;s2++){
    if(!S.lt[fwId+'_'+s2])unseenSeeds.push(s2);
  }
  unseenSeeds=shuf(unseenSeeds);
  for(var j=0;j<unseenSeeds.length&&items.length<count;j++){
    var item2=genItem(fwId,unseenSeeds[j]);
    if(!item2)continue;
    var key2=(item2.response||item2.task||item2.instruction||'')+item2.correct;
    if(seen.has(key2))continue;
    seen.add(key2);items.push(item2);
  }
  // PHASE 3: Fill remaining from any seed
  if(items.length<count){
    var allSeeds=shuf(Array.from({length:_ps},function(_,i){return i;}));
    for(var k=0;k<allSeeds.length&&items.length<count;k++){
      var item3=genItem(fwId,allSeeds[k]);
      if(!item3)continue;
      var key3=(item3.response||item3.task||item3.instruction||'')+item3.correct;
      if(seen.has(key3))continue;
      seen.add(key3);items.push(item3);
    }
  }
  return items;
}

/* ═══ LEITNER & MASTERY ═══ */
function getBox(uid){return S.lt[uid]||0;}
function setBox(uid,box){S.lt[uid]=Math.max(1,Math.min(5,box));sv();}
function getMast(fid){
  var ps=getPS(fid);
  var keys=Object.keys(S.lt).filter(function(k){return k.startsWith(fid+'_');});
  if(keys.length===0)return 0;
  var total=0;
  keys.forEach(function(k){total+=Math.min(S.lt[k],5)/5;});
  return Math.round(total/ps*100);
}
function getAreaMast(aid){
  var fws=FW.filter(function(f){return f.area===aid&&isUL(f.id);});
  if(!fws.length)return 0;
  var t=0,m=0;
  fws.forEach(function(f){
    var fps=getPS(f.id);
    var ks=Object.keys(S.lt).filter(function(k){return k.startsWith(f.id+'_');});
    t+=fps;
    ks.forEach(function(k){m+=Math.min(S.lt[k],5)/5;});
  });
  return t>0?Math.round(m/t*100):0;
}

/* ═══ ADAPTIVE SESSION MIXER ═══ */
function buildSession(count){
  count=count||12;
  var unlocked=FW.filter(function(f){return isUL(f.id);});
  if(!unlocked.length)return[];
  var areaW={};var totalW=0;
  AREAS.forEach(function(a){
    var hasContent=unlocked.some(function(f){return f.area===a.id;});
    if(!hasContent){areaW[a.id]=0;return;}
    var m=getAreaMast(a.id);
    var adj=a.w*(1+(1-m/100)*1.5);
    areaW[a.id]=adj;totalW+=adj;
  });
  if(totalW===0)return[];
  var targets={};var assigned=0;
  var active=AREAS.filter(function(a){return areaW[a.id]>0;});
  active.forEach(function(a,i){
    if(i===active.length-1){targets[a.id]=count-assigned;return;}
    var t=Math.max(1,Math.round(count*areaW[a.id]/totalW));
    targets[a.id]=t;assigned+=t;
  });
  var session=[];
  AREAS.forEach(function(a){
    var t=targets[a.id]||0;if(t===0)return;
    var aFws=unlocked.filter(function(f){return f.area===a.id;});
    if(!aFws.length)return;
    var fwW=aFws.map(function(f){return{fw:f,w:1+(1-getMast(f.id)/100)*2};});
    var totFW=fwW.reduce(function(s,x){return s+x.w;},0);
    var aItems=[];
    fwW.forEach(function(item){
      var n=Math.max(1,Math.round(t*item.w/totFW));
      var pool=genPool(item.fw.id,n*3);
      pool.sort(function(a,b){return getBox(a.uid)-getBox(b.uid);});
      aItems=aItems.concat(pool.slice(0,n));
    });
    session=session.concat(aItems.slice(0,t));
  });
  return shuf(session);
}

function buildPractice(fwId,count){
  count=count||15;
  var pool=genPool(fwId,count*2);
  pool.sort(function(a,b){return getBox(a.uid)-getBox(b.uid);});
  return pool.slice(0,count);
}

  h+='<div class="sr2">'+item.response+'</div><div class="ops" id="ops">';
  var lb=fw.labels||{};var keys=Object.keys(lb);
  for(var i=0;i<keys.length;i++){
    h+='<div class="op" onclick="aCl(\''+keys[i]+'\',this)" data-k="'+keys[i]+'"><span class="om">'+String.fromCharCode(65+i)+'</span><span>'+lb[keys[i]]+'</span></div>';
  }
  return h+'</div>';
}
function rBP(item){
  window._bp=item.options;
  var h='<div class="sq">Scegli la risposta migliore:</div><div class="ss2">'+item.scenario+'</div><div class="ops" id="ops">';
  for(var i=0;i<item.options.length;i++){
    h+='<div class="op" onclick="aBP('+i+',this)" data-c="'+item.options[i].correct+'"><span class="om">'+String.fromCharCode(65+i)+'</span><span>'+item.options[i].text+'</span></div>';
  }
  return h+'</div>';
}
function rOr(item){
  if(!window._os){
    var idx=[];for(var i=0;i<item.steps.length;i++)idx.push(i);
    for(var i2=idx.length-1;i2>0;i2--){var j=Math.floor(Math.random()*(i2+1));var tmp=idx[i2];idx[i2]=idx[j];idx[j]=tmp;}
    var allCorrect=true;for(var c=0;c<idx.length;c++){if(idx[c]!==c){allCorrect=false;break;}}
    if(allCorrect){tmp=idx[0];idx[0]=idx[1];idx[1]=tmp;}
    window._os=idx;
  }
  var order=window._os;
  var h='<div class="sq">'+item.instruction+'</div><div class="os" id="osl">';
  for(var p=0;p<order.length;p++){
    h+='<div class="oi" data-s="'+order[p]+'"><span class="on">'+(p+1)+'</span><span style="flex:1">'+item.steps[order[p]]+'</span><span class="oa"><button onclick="mO('+p+',-1)"'+(p===0?' disabled':'')+'>▲</button><button onclick="mO('+p+',1)"'+(p===order.length-1?' disabled':'')+'>▼</button></span></div>';
  }
  return h+'</div><button class="btn btn-g btn-f" onclick="cO()">CONTROLLA</button>';
}
function rQd(item,fw){
  var quads=fw.quads||[];
  var h='<div class="sq">In quale quadrante?</div><div class="ss2">'+item.task+'</div><div class="qg" id="qg">';
  for(var i=0;i<quads.length;i++){
    h+='<div class="qc" onclick="aQd(\''+quads[i].id+'\',this)" data-q="'+quads[i].id+'" style="border-top:3px solid '+quads[i].co+'"><div class="qt">'+quads[i].n+'</div><div class="qd">'+quads[i].d+'</div></div>';
  }
  return h+'</div>';
}

/* ═══ ANSWERS ═══ */
function aCl(k,el){
  var item=S.cs[S.si];
  var opts=document.querySelectorAll('#ops .op');
  for(var i=0;i<opts.length;i++){opts[i].classList.add('dis');if(opts[i].getAttribute('data-k')===item.correct)opts[i].classList.add('rc');}
  if(k===item.correct){el.classList.add('cor');sC();S.sco++;S.tc++;setBox(item.uid,getBox(item.uid)+1);axp(10+(S.sco>=3?5:0));}
  else{el.classList.add('wrg');sW();S.swr++;S.tw++;S.hr--;setBox(item.uid,1);}
  updTB();sv();
  sFB(k===item.correct,k===item.correct?item.feedback[item.correct]:(item.feedback[k]||'Non corretto.'));
}
function aBP(i,el){
  var item=S.cs[S.si];var opt=window._bp[i];
  var opts=document.querySelectorAll('#ops .op');
  for(var j=0;j<opts.length;j++){opts[j].classList.add('dis');if(opts[j].getAttribute('data-c')==='true')opts[j].classList.add('rc');}
  if(opt.correct){el.classList.add('cor');sC();S.sco++;S.tc++;setBox(item.uid,getBox(item.uid)+1);axp(10+(S.sco>=3?5:0));}
  else{el.classList.add('wrg');sW();S.swr++;S.tw++;S.hr--;setBox(item.uid,1);}
  updTB();sv();
  sFB(opt.correct,opt.feedback);
}
function mO(p,d){
  var np=p+d;if(np<0||np>=window._os.length)return;
  var a=window._os;var tmp=a[p];a[p]=a[np];a[np]=tmp;sT();
  var item=S.cs[S.si];var c=document.getElementById('osl');c.innerHTML='';
  for(var pp=0;pp<a.length;pp++){
    c.innerHTML+='<div class="oi" data-s="'+a[pp]+'"><span class="on">'+(pp+1)+'</span><span style="flex:1">'+item.steps[a[pp]]+'</span><span class="oa"><button onclick="mO('+pp+',-1)"'+(pp===0?' disabled':'')+'>▲</button><button onclick="mO('+pp+',1)"'+(pp===a.length-1?' disabled':'')+'>▼</button></span></div>';
  }
}
function cO(){
  var item=S.cs[S.si];var o=window._os;
  var ok=true;for(var i=0;i<o.length;i++){if(o[i]!==i){ok=false;break;}}
  var els=document.querySelectorAll('.oi');
  for(var j=0;j<els.length;j++){els[j].style.borderColor=o[j]===j?'var(--green)':'var(--red)';}
  var btns=document.querySelectorAll('.oa button');
  for(var k=0;k<btns.length;k++){btns[k].disabled=true;}
  if(ok){sC();S.sco++;S.tc++;setBox(item.uid,getBox(item.uid)+1);axp(15);}
  else{sW();S.swr++;S.tw++;S.hr--;setBox(item.uid,1);}
  window._os=null;updTB();sv();
  sFB(ok,ok?item.feedback:'Ordine non corretto. '+item.feedback);
}
function aQd(qid,el){
  var item=S.cs[S.si];
  var cells=document.querySelectorAll('.qc');
  for(var i=0;i<cells.length;i++){cells[i].classList.add('dis');cells[i].style.pointerEvents='none';if(cells[i].getAttribute('data-q')===item.correct)cells[i].classList.add('cor');}
  if(qid===item.correct){el.classList.add('cor');sC();S.sco++;S.tc++;setBox(item.uid,getBox(item.uid)+1);axp(10);}
  else{el.classList.add('wrg');sW();S.swr++;S.tw++;S.hr--;setBox(item.uid,1);}
  updTB();sv();
  sFB(qid===item.correct,item.feedback);
}

/* ═══ FEEDBACK & FLOW ═══ */
function sFB(ok,txt){
  fb.style.display='block';
  fb.innerHTML='<div class="fb '+(ok?'fc':'fw')+'"><div class="fi"><div class="ft">'+(ok?'🎉 Corretto!':'😕 Non proprio...')+'</div><div class="fx">'+txt+'</div><button class="btn '+(ok?'btn-g':'btn-ol')+' btn-f" onclick="nI()">CONTINUA</button></div></div>';
}
function nI(){fb.style.display='none';fb.innerHTML='';window._os=null;window._bp=null;S.si++;sv();if(S.hr<=0||S.si>=S.cs.length){endS();}else{R();}}
function endS(){S.sc++;ckStr();S.scr='results';sv();R();}

function rR(){
  var tot=S.sco+S.swr,pct=tot>0?Math.round(S.sco/tot*100):0;
  var em=pct>=80?'🏆':pct>=60?'💪':pct>=40?'📚':'🔄';
  var msg=pct>=80?'Fantastico!':pct>=60?'Buon lavoro!':pct>=40?'Stai migliorando!':'Non mollare!';
  var cft='';
  if(pct>=70){var cs=['var(--green)','var(--blue)','var(--purple)','var(--orange)','var(--amber)'];for(var i=0;i<20;i++){cft+='<div class="cp" style="left:'+Math.random()*100+'%;background:'+cs[i%cs.length]+';animation-delay:'+Math.random()+'s;animation-duration:'+(1.5+Math.random())+'s"></div>';}}
  setTimeout(ckUL,800);
  var rhtml=cft;
  rhtml+='<div class="res"><span class="rm">'+em+'</span><h2>'+msg+'</h2>';
  rhtml+='<p style="color:var(--text2);font-weight:600;margin-bottom:16px">Sessione completata</p>';
  rhtml+='<div class="rg"><div class="rs"><div class="rv" style="color:var(--green-d)">'+S.sco+'</div><div class="rl">Corrette</div></div>';
  rhtml+='<div class="rs"><div class="rv" style="color:var(--red-d)">'+S.swr+'</div><div class="rl">Errori</div></div>';
  rhtml+='<div class="rs"><div class="rv" style="color:var(--amber-d)">'+pct+'%</div><div class="rl">Precisione</div></div></div>';
  rhtml+='<div style="text-align:left;background:var(--bg2);border:2px solid var(--bg3);border-radius:var(--r);padding:16px;margin-bottom:14px">';
  rhtml+='<div style="font-weight:700;margin-bottom:6px">🔥 Streak: '+S.str+' giorn'+(S.str===1?'o':'i')+'</div>';
  rhtml+='<div style="font-weight:700">⭐ Livello '+S.lv+' ('+S.xp+'/'+(50+S.lv*30)+' XP)</div></div>';
  rhtml+='<button class="btn btn-g btn-f" style="margin-top:8px" onclick="goHome()">TORNA ALLA HOME</button>';
  rhtml+='<button class="btn btn-ol btn-f" style="margin-top:8px" onclick="stSe()">🔄 ALLENATI ANCORA</button>';
  rhtml+='</div>';
  ap.innerHTML=rhtml;
  if(pct>=70)sF();
}

/* ═══ NAV & BACKUP ═══ */
var _bkT=0;
function goBack(){
  var now=Date.now();
  if(now-_bkT<2000){_bkT=0;S.scr='home';S.cs=null;window._os=null;window._bp=null;fb.style.display='none';fb.innerHTML='';sv();R();return;}
  _bkT=now;sT();
  var el=document.getElementById('tbt');
  if(el){var ov=el.textContent;el.textContent='⚠️ Tap di nuovo per uscire';el.style.color='var(--red)';setTimeout(function(){var e2=document.getElementById('tbt');if(e2){e2.textContent=ov;e2.style.color='';}},2000);}
}
function expJ(){var d=JSON.stringify(S,null,2);var b=new Blob([d],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='softskillo_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(u);}
function impJ(e){var f=e.target.files[0]; /* FIXED: function was truncated */
if(!f)return;var r=new FileReader();r.onload=function(ev){try{S=Object.assign(ds(),JSON.parse(ev.target.result));sv();R();showToast('✅ Progressi importati!');}catch(err){showToast('❌ File non valido');}};r.readAsText(f);e.target.value='';}
function showToast(msg){var t=document.getElementById('toast');t.innerHTML='<div class="ut" style="border-color:var(--blue)"><div style="font-family:Fredoka;font-weight:600;font-size:.95em">'+msg+'</div></div>';setTimeout(function(){t.innerHTML='';},2500);}

R();
</script>
